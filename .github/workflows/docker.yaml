name: Sync Home Assistant to Aliyun ACR

on:
  workflow_dispatch: # 支持手动触发
  schedule:
    - cron: '0 2 * * *' # 可选：每天定时自动同步一次

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Pull Home Assistant from GHCR (Bypass Docker Hub limits)
        run: |
          echo "Pulling Home Assistant from GitHub Container Registry..."
          docker pull ghcr.io/home-assistant/home-assistant:latest

      - name: Tag and Push to Aliyun ACR
        run: |
          # 组装阿里云目标镜像地址
          TARGET_IMAGE="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/home-assistant:latest"
          
          echo "Tagging image for Aliyun..."
          docker tag ghcr.io/home-assistant/home-assistant:latest $TARGET_IMAGE
          
          echo "Pushing image to Aliyun ACR..."
          docker push $TARGET_IMAGE
          echo "Push completed successfully!"
