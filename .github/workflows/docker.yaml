name: Sync Home Assistant to Aliyun ACR

on:
  workflow_dispatch: # 支持手动点击运行
  schedule:
    - cron: '0 2 * * *' # 每天定时同步

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Pull Home Assistant from GHCR
        run: |
          echo "==> 正在从 GHCR 拉取 Home Assistant 镜像..."
          docker pull ghcr.io/home-assistant/home-assistant:latest

      - name: Tag and Push to Aliyun ACR
        run: |
          RAW_REGISTRY="${{ secrets.ALIYUN_REGISTRY }}"
          NAMESPACE="${{ secrets.ALIYUN_NAMESPACE }}"
          
          # 自动过滤掉可能误填的 https:// 前缀，防止路径解析错误
          CLEAN_REGISTRY=$(echo "$RAW_REGISTRY" | sed 's|https://||g' | sed 's|http://||g')
          
          TARGET_IMAGE="$CLEAN_REGISTRY/$NAMESPACE/home-assistant:latest"
          
          echo "==> 目标推送地址: $TARGET_IMAGE"
          
          echo "==> 正在给镜像打 Tag..."
          docker tag ghcr.io/home-assistant/home-assistant:latest $TARGET_IMAGE
          
          echo "==> 正在推送到阿里云 ACR..."
          docker push $TARGET_IMAGE
          echo "==> 推送全部完成！"
